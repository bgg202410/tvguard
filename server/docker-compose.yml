# 免构建版：直接用官方 node 镜像跑源码，不编译、不装包
# 只需要能拉到一次 node:20-alpine 镜像即可
services:
  tvguard:
    image: node:20-alpine
    container_name: tvguard-admin
    restart: unless-stopped
    working_dir: /app
    # 不用 Dockerfile，直接跑源码；改 js 后重启容器即生效
    command: ["node", "src/app.js"]
    # 用宿主机网络栈：默认 bridge 下容器出不到电视的 5555 端口
    # （截图 / 离线唤醒 / 保活修复会超时），且外部请求源 IP 会被 NAT 成
    # Docker 网桥网关，被误当成电视 IP。host 模式一并解决。
    # 改完要重建容器（docker compose up -d --force-recreate），只重启不会换网络。
    network_mode: host
    # host 模式不需要 ports 映射，容器直接监听 PORT=8088；浏览器访问
    # http://<宿主机 IP>:8088 。若不方便用 host，可注释上面一行、启用下面
    # 的端口映射，但那样必须另外打通容器到局域网电视的路由，adb 功能会不可用。
    # ports:
    #   - "8088:8088"
    environment:
      # 用 POSIX 时区写法，镜像里没有 tzdata 也能走对
      TZ: "CST-8"
      PORT: "8088"
      DATA_DIR: /data
      # ===== 登录密码：部署前务必改成自己的，然后重启容器 =====
      ADMIN_PASSWORD: "ChangeMe_2026"
    volumes:
      # 可写挂载：后台「服务端升级」要自己替换 src/public 里的代码文件。
      # 以前是 :ro（只读），升级接口会报「只读挂载」；改成 rw 后重启一次即可，
      # 之后所有升级都在后台点一下完成。data 是唯一的数据目录，升级包不会碰它。
      - ./src:/app/src:rw
      - ./public:/app/public:rw
      - ./data:/data
